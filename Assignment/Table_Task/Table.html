<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
   <style>
    table{
        border-collapse: collapse;
    }
    td,th {
        border-collapse: collapse;
        border: 1px solid black;
        padding: 10px;
       
    }
    th{
      
         background-color: salmon;
       
    }
     .heading{
        text-align: center;
     }
     tr:nth-child(even){
         background-color:darksalmon;
     }
   </style>
</head>
<body>
    <h2 class="heading">Bank Details</h2>
    <table>
        <tr>
            <th>User Name</th>
             <th>Bank Name</th>
            <th>Bank Balance</th>
            <th>Withdraw</th>
            <th>Deposited Amount</th>
        </tr>
        <tr>
            <td>Deepa</td>
            <td>IOB</td>
            <td>20,000</td>
            <td>5,000</td>
            <td>10,000</td>
        </tr>
          <tr>
            <td>Divya</td>
            <td>Inidan Bank</td>
            <td>50,000</td>
            <td>10,000</td>
            <td>20,000</td>
        </tr>
          <tr>
            <td>Mohana</td>
            <td>Canara Bank</td>
            <td>30,000</td>
            <td>9,000</td>
            <td>10,000</td>
        </tr>
          <tr>
            <td>Abinaya</td>
            <td>SBI</td>
            <td>25,000</td>

        </tr>
          <tr>
            <td>Vaishu</td>

            <td>38,000</td>
            <td>9,000</td>
            <td>10,000</td>
        </tr>
    </table>
</body>
</html>
