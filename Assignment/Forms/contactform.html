<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        form{
            background-color: darkgray;
           height: auto;
           width: 300px;
            margin: auto;
            border: 2px solid black;
            padding: 20px;
            border-radius: 20px;
           
        }
        #button{
            width: 30%;
            background-color: black;
            color: white;
            border: none;
           display: block;
           margin: auto;
           border-radius: 2px;   
        }
        input{
            width: 80%;
            padding: 10px;
            border: none;
            border-radius: 2px;
            margin-left: 20px;
        }
        label{
            font-weight: bold;
            font-size: large;
        }
        h1{
            text-align: center;
        }
        textarea {
               width: 80%;
            padding: 10px;
            border: none;
            border-radius: 2px;
            margin-left: 20px;
        }
        
    </style>
</head>
<body>
    <h1>Contact Form</h1>
   <form action="/action_page.php">
        <label for="fname">First Name:</label>
        <br><br>
        <input type="text" id="fname" placeholder="Enter the Name" required name="fname">
        <br><br>
        <label for="lname">Last Name:</label>
        <br><br>
        <input type="text" id="lname" placeholder="Enter the Name" required name="lname">
        <br><br>
        <label for="Email">Email:</label>
        <br><br>
        <input type="email" id="Email" placeholder="Enter the Email" required name="Email">
        <br><br>
        <label for="phone">Phone Number:</label>
        <br><br>
        <input type="number" id="phone" placeholder="Enter the Phone Number" required name="number">
        <br><br>
        <label>Message:</label>
        <br><br>
        <textarea rows="4" placeholder="Enter your message"></textarea>
         <br><br>
       <input  type="submit" id="button" value="Submit">

        
    </form>
</body>
</html>
